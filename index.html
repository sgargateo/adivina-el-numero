<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎯 Adivina el número</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f5f7;color:#17202a}
main{max-width:1050px;margin:auto;padding:22px}
.card{background:#fff;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 5px 22px rgba(0,0,0,.08)}
h1{margin:0 0 6px;font-size:36px} h2{margin-top:0}
input,button{width:100%;padding:14px;margin:7px 0;border-radius:11px;font-size:18px}
input{border:1px solid #cbd3da} button{border:0;background:#17202a;color:#fff;cursor:pointer}
button.secondary{background:#e8edf1;color:#17202a}
button.danger{background:#8b1e1e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.code{text-align:center;font-size:38px;font-weight:800;letter-spacing:6px;padding:10px}
.qr{text-align:center}.qr img{width:260px;height:260px;border-radius:12px}
.center{text-align:center}.big{font-size:29px;font-weight:800;min-height:48px;margin:18px 0}
.status{padding:13px;border-radius:10px;background:#eef2f5;margin:10px 0}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:#f5f7f9;border-radius:12px;padding:15px;text-align:center}.stat b{display:block;font-size:25px}
table{width:100%;border-collapse:collapse}td,th{padding:11px;border-bottom:1px solid #e8ecef;text-align:left}
.small{font-size:14px;color:#66727d}
.hidden{display:none!important}.ok{font-size:34px;font-weight:800}
.wait{font-size:20px;text-align:center;padding:20px}
@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr 1fr}h1{font-size:30px}}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🎯 Adivina el número</h1>
<div class="small">Dinámica interactiva para clase</div>
</div>

<div id="teacher" class="hidden">
<div class="card">
<h2>👩‍🏫 Pantalla del profesor</h2>
<div class="grid">
<div>
<label>Número secreto (1–100)</label>
<input id="secret" type="number" min="1" max="100" placeholder="Ej. 57">
<button id="createRoom">Crear sala</button>
<button id="newRound" class="secondary" disabled>🔄 Nueva ronda (mismo QR)</button>
</div>
<div>
<div class="small center">CÓDIGO DE SALA</div>
<div id="teacherRoom" class="code">----</div>
<div class="qr"><img id="qr" alt="QR para participar"></div>
<div class="center small" id="joinUrl"></div>
</div>
</div>
<div class="statgrid">
<div class="stat"><b id="connected">0</b>conectados</div>
<div class="stat"><b id="attemptTotal">0</b>intentos</div>
<div class="stat"><b id="winnerTotal">0</b>ganadores</div>
</div>
<div class="status" id="teacherState">Crea una sala para comenzar.</div>
</div>

<div class="card">
<h2>🏆 Ranking de la ronda</h2>
<div id="teacherRanking" class="wait">Aún no hay ganadores.</div>
</div>
</div>

<div id="player" class="hidden">
<div class="card">
<h2>📱 Pantalla del participante</h2>
<div class="status">Sala: <b id="playerRoom"></b></div>
<div id="joinBox">
<input id="playerName" placeholder="Tu nombre">
<button id="join">Entrar al juego</button>
</div>
<div id="gameBox" class="hidden">
<div class="status center">Jugador: <b id="playerLabel"></b></div>
<input id="playerGuess" type="number" min="1" max="100" placeholder="Número entre 1 y 100">
<button id="sendGuess">Probar número</button>
<div id="playerMsg" class="big center"></div>
<div id="playerAttempts" class="center small">Intentos: 0</div>
</div>
</div>
</div>

<div id="home" class="card hidden">
<h2>¿Cómo quieres entrar?</h2>
<button onclick="location.href='?modo=profesor'">👩‍🏫 Soy profesor</button>
<button class="secondary" onclick="location.href='?modo=participante'">📱 Soy participante</button>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, set, push, onValue, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJervUq7PKrAncGWR20YL_yH2Ut399VY8",
  authDomain: "adivina-el-numero-b1239.firebaseapp.com",
  databaseURL: "https://adivina-el-numero-b1239-default-rtdb.firebaseio.com",
  projectId: "adivina-el-numero-b1239",
  storageBucket: "adivina-el-numero-b1239.firebasestorage.app",
  messagingSenderId: "1002866563599",
  appId: "1:1002866563599:web:bf0c83973c475477eba17a"
};
const app=initializeApp(firebaseConfig), db=getDatabase(app);
const params=new URLSearchParams(location.search), mode=params.get("modo"), salaInicial=params.get("sala");
const $=id=>document.getElementById(id);
const roomRef=r=>ref(db,"rooms/"+r);
let room=salaInicial||null, secret=null, round=0, stopListening=null;
const scores={};

function randomRoom(){return Math.random().toString(36).slice(2,6).toUpperCase()}
function pid(){let x=localStorage.getItem("adivinaPlayerId");if(!x){x=crypto.randomUUID();localStorage.setItem("adivinaPlayerId",x)}return x}
function qrUrl(u){return "https://quickchart.io/qr?size=320&text="+encodeURIComponent(u)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

if(mode==="profesor"){
 $("teacher").classList.remove("hidden");
 $("createRoom").onclick=createRoom;
 $("newRound").onclick=newRound;
 async function createRoom(){
   const n=Number($("secret").value);
   if(!n||n<1||n>100){alert("Ingresa un número entre 1 y 100.");return}
   room=randomRoom(); secret=n; round=1; Object.keys(scores).forEach(k=>delete scores[k]);
   await set(roomRef(room),{active:true,round,createdAt:Date.now()});
   setupTeacherUI(); listenGuesses(); $("newRound").disabled=false;
 }
 async function newRound(){
   const n=Number($("secret").value);
   if(!n||n<1||n>100){alert("Ingresa el nuevo número secreto.");return}
   secret=n; round++; Object.keys(scores).forEach(k=>delete scores[k]);
   await set(ref(db,"guesses/"+room),null); await set(ref(db,"results/"+room),null);
   await set(roomRef(room),{active:true,round,createdAt:Date.now()});
   $("attemptTotal").textContent="0"; $("winnerTotal").textContent="0"; renderRanking();
   $("teacherState").textContent="🟢 Nueva ronda activa. ¡Mismo QR!";
 }
 function setupTeacherUI(){
   $("teacherRoom").textContent=room;
   const u=location.origin+location.pathname+"?modo=participante&sala="+room;
   $("qr").src=qrUrl(u); $("joinUrl").textContent=u;
   $("teacherState").textContent="🟢 Sala activa. Comparte el QR.";
 }
 function listenGuesses(){
   const r=ref(db,"guesses/"+room);
   onValue(r,snap=>{
     const data=snap.val()||{}; let total=0;
     Object.keys(data).forEach(p=>{
       const arr=Object.values(data[p]||{}).filter(x=>x.round===round).sort((a,b)=>a.at-b.at);
       if(!scores[p]) scores[p]={name:arr[0]?.name||"Participante",attempts:0,correct:false};
       scores[p].attempts=arr.length;
       const hit=arr.find(x=>Number(x.guess)===secret);
       scores[p].correct=!!hit;
       total+=arr.length;
       if(arr.length){
         const last=arr[arr.length-1];
         const message=Number(last.guess)<secret?"🔼 El número secreto es MAYOR":Number(last.guess)>secret?"🔽 El número secreto es MENOR":"🎯 ¡CORRECTO!";
         set(ref(db,"results/"+room+"/"+p),{message,attempts:arr.length,correct:scores[p].correct,name:scores[p].name,round});
       }
     });
     $("attemptTotal").textContent=total;
     const wins=Object.values(scores).filter(x=>x.correct).length;
     $("winnerTotal").textContent=wins; renderRanking();
   });
   onValue(ref(db,"presence/"+room),snap=>{$("connected").textContent=Object.keys(snap.val()||{}).length});
 }
 function renderRanking(){
   const a=Object.values(scores).filter(x=>x.correct).sort((x,y)=>x.attempts-y.attempts);
   if(!a.length){$("teacherRanking").textContent="Aún no hay ganadores.";return}
   $("teacherRanking").innerHTML="<table><tr><th>#</th><th>Participante</th><th>Intentos</th></tr>"+a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.attempts}</td></tr>`).join("")+"</table>";
 }
}else if(mode==="participante"&&room){
 $("player").classList.remove("hidden"); $("playerRoom").textContent=room;
 const id=pid(); let joined=false;
 onValue(roomRef(room),snap=>{
   const d=snap.val();
   if(!d){$("playerMsg").textContent="⚠️ Sala no encontrada";return}
   if(d.round!==round){round=d.round; $("playerMsg").textContent="🟢 Nueva ronda. ¡A jugar!"; $("playerAttempts").textContent="Intentos: 0"}
 });
 $("join").onclick=async()=>{
   const name=$("playerName").value.trim();
   if(!name){alert("Escribe tu nombre.");return}
   joined=true; $("playerLabel").textContent=name; $("joinBox").classList.add("hidden"); $("gameBox").classList.remove("hidden");
   await set(ref(db,"presence/"+room+"/"+id),{name,at:Date.now()});
   await set(ref(db,"players/"+room+"/"+id),{name});
 };
 $("sendGuess").onclick=async()=>{
   if(!joined)return;
   const g=Number($("playerGuess").value);
   if(!g||g<1||g>100){alert("Ingresa un número entre 1 y 100.");return}
   const k=push(ref(db,"guesses/"+room+"/"+id)).key;
   await set(ref(db,"guesses/"+room+"/"+id+"/"+k),{name:$("playerLabel").textContent,guess:g,round,at:Date.now()});
   $("playerGuess").value="";
 };
 onValue(ref(db,"results/"+room+"/"+id),snap=>{
   const d=snap.val(); if(!d||d.round!==round)return;
   $("playerMsg").innerHTML=esc(d.message); $("playerAttempts").textContent="Intentos: "+d.attempts;
 });
}else $("home").classList.remove("hidden");
</script>
</body>
</html>
